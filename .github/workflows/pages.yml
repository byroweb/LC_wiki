# Publish the generated site to GitHub Pages.
#
# The site is committed under site/, which Pages cannot serve directly (it only
# serves a branch root or /docs), so this uploads that folder as the Pages
# artifact on every push to main. Nothing is built here: the generator needs the
# LostCityRS content checkouts, which are not in this repository, so rebuild
# locally and commit the result. Pages must be set to "GitHub Actions" as its
# source once (Settings -> Pages -> Build and deployment).
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
